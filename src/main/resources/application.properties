spring.application.name=security-auth

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2080ms

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:test}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

app.otp.expiry-minutes=10
app.otp.length=6

app.security.lockout-duration-minutes=30
app.security.max-login-attempts=5

app.rate-limit.login-capacity=10
app.rate-limit.login-refill-token=10
app.rate-limit.login-refill-minutes=1

app.cors.allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging.level.com.example= DEBUG
logging.level.org.springframework.security= INFO